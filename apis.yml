description: 'Dingdong Maicai (叮咚买菜), operated by Shanghai Yibai Mi Network Technology Co., Ltd., is
  a Chinese on-demand fresh grocery e-commerce and delivery platform. It runs a mobile-app marketplace
  for fresh produce, meat, seafood, prepared foods, and daily groceries, backed by a network of front-line
  neighborhood micro-fulfillment stations that enable fast, same-hour delivery in major Chinese cities.
  The company is publicly listed on the NYSE (ticker DDL) and was backed by SoftBank Vision Fund. It is a
  consumer-facing operation with no public developer program or open API surface; this profile is a network
  lead maintained by the API Evangelist enrichment pipeline.'
